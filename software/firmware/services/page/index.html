<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DonaTelos</title>
<style>
  :root { --bg: #F1F1F3; --ink: #3A3C4A; --soft: #6B6E7B; --shell: #6BAF6B;
          --shell-dark: #4E8F57; --band: #8E6CC9; --coral: #EE8172;
          --card: #FFFFFF; --line: #E2E3E8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
               font-family: system-ui, "Segoe UI", Roboto, sans-serif;
               touch-action: none; user-select: none; -webkit-user-select: none; }
  body { display: flex; flex-direction: column; align-items: center;
         padding: 16px; gap: 16px; }
  header { width: 100%; max-width: 420px; display: flex; align-items: center;
           justify-content: space-between; }
  h1 { font-size: 20px; margin: 0; color: var(--shell-dark); }
  .pill { border-radius: 999px; padding: 6px 12px; font-size: 13px;
          font-weight: 600; background: #DCDDFB; color: #4B4E9A; }
  .pill.ok { background: #CDEFD9; color: #2F6B47; }
  .pill.bad { background: #F8D2CC; color: #8A3B30; }
  #pad { position: relative; width: min(80vw, 340px); aspect-ratio: 1;
         border-radius: 50%; background: var(--card); border: 2px solid var(--line);
         box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  #pad::before, #pad::after { content: ""; position: absolute; background: var(--line); }
  #pad::before { left: 50%; top: 12%; bottom: 12%; width: 2px; }
  #pad::after { top: 50%; left: 12%; right: 12%; height: 2px; }
  #knob { position: absolute; width: 34%; aspect-ratio: 1; border-radius: 50%;
          left: 33%; top: 33%; background: var(--shell);
          border: 4px solid var(--shell-dark); box-shadow: 0 3px 8px rgba(0,0,0,.18);
          z-index: 1; }
  .row { width: 100%; max-width: 420px; display: flex; gap: 12px; }
  .card { flex: 1; background: var(--card); border: 1px solid var(--line);
          border-radius: 14px; padding: 12px; }
  .card small { color: var(--soft); display: block; font-size: 12px; }
  .card b { font-size: 22px; }
  .modes { width: 100%; max-width: 420px; display: grid;
           grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .modes button { border: 1px solid var(--line); border-radius: 12px;
                  background: var(--card); color: var(--ink); padding: 10px 4px;
                  font-size: 14px; font-weight: 600; }
  .modes button.on { background: var(--band); border-color: var(--band);
                     color: #fff; }
  .trim { display: flex; align-items: center; justify-content: space-between;
          gap: 8px; }
  .trim button { border: 1px solid var(--line); border-radius: 10px;
                 background: var(--bg); color: var(--ink); width: 40px;
                 height: 36px; font-size: 16px; font-weight: 700; }
  #low { width: 100%; max-width: 420px; border-radius: 14px; padding: 12px;
         background: #FCE7B2; color: #7A5A00; font-weight: 700;
         text-align: center; }
  #stop { width: 100%; max-width: 420px; border: 0; border-radius: 14px;
          padding: 16px; font-size: 18px; font-weight: 700; color: #fff;
          background: var(--coral); }
</style>
</head>
<body>
<header>
  <h1>🐢 DonaTelos</h1>
  <div id="state" class="pill">conectando…</div>
</header>
<div id="low" hidden>🔋 Bateria baixa — hora de voltar pro pit</div>
<div class="modes" id="modes">
  <button data-mode="eco" class="on">Eco</button>
  <button data-mode="fine">Fino</button>
  <button data-mode="full">Tudo</button>
  <button data-mode="war">Guerra</button>
</div>
<div id="pad"><div id="knob"></div></div>
<div class="row">
  <div class="card"><small>Bateria</small><b id="bat">—</b></div>
  <div class="card"><small>Comando</small><b id="cmd">0, 0</b></div>
</div>
<div class="row">
  <div class="card">
    <small>Ajuste pra andar reto (puxa pra um lado? empurra pro outro)</small>
    <div class="trim">
      <button id="trim-left">◀</button>
      <b id="trim">0%</b>
      <button id="trim-right">▶</button>
    </div>
  </div>
</div>
<button id="stop">PARAR</button>
<script>
  // Dois canais com o barco (o protocolo todo está em services/protocol.hpp):
  //  - WebSocket /ws: o joystick, 20 vezes por segundo — é o batimento que o
  //    failsafe vigia;
  //  - API REST /api: o estado (GET /api/status) e os ajustes
  //    (PATCH /api/settings).
  const $ = id => document.getElementById(id);
  const pad = $("pad"), knob = $("knob"), state = $("state");
  let x = 0, y = 0, ws = null, pointer = null;

  // ------------------------------------------------------------ Joystick
  // x pro lado, y pra frente, de -100 a 100
  function setKnob(nx, ny) {
    x = Math.round(nx * 100); y = Math.round(ny * 100);
    knob.style.left = (33 + nx * 33) + "%";
    knob.style.top = (33 - ny * 33) + "%";
    $("cmd").textContent = x + ", " + y;
  }

  function move(ev) {
    const r = pad.getBoundingClientRect();
    let nx = (ev.clientX - r.left) / r.width * 2 - 1;
    let ny = 1 - (ev.clientY - r.top) / r.height * 2;
    const len = Math.hypot(nx, ny);
    if (len > 1) { nx /= len; ny /= len; }
    setKnob(nx, ny);
  }

  pad.addEventListener("pointerdown", ev => {
    pointer = ev.pointerId; pad.setPointerCapture(pointer); move(ev);
  });
  pad.addEventListener("pointermove", ev => { if (ev.pointerId === pointer) move(ev); });
  const release = ev => {
    if (ev.pointerId === pointer) { pointer = null; setKnob(0, 0); }
  };
  pad.addEventListener("pointerup", release);
  pad.addEventListener("pointercancel", release);
  $("stop").addEventListener("pointerdown", () => setKnob(0, 0));

  // Manda mesmo parado: sem isso, o failsafe para o barco
  function connect() {
    ws = new WebSocket("ws://" + location.host + "/ws");
    ws.onopen = () => showLink();
    ws.onclose = () => { showLink(); setTimeout(connect, 1000); };
  }
  setInterval(() => {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(x + "," + y);
  }, 50);

  // ------------------------------------------------------------ Ajustes
  // PATCH /api/settings com só o que mudou; o barco aplica na próxima volta
  // do laço, e o estado seguinte mostra o que ficou
  function patchSettings(change) {
    fetch("/api/settings", {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(change),
    }).then(askStatus).catch(() => {});
  }

  // Modos: o botão pede, o estado confirma (acende o modo que o barco usa)
  const modes = $("modes");
  function showMode(mode) {
    for (const b of modes.children) b.classList.toggle("on", b.dataset.mode === mode);
  }
  modes.addEventListener("click", ev => {
    const mode = ev.target.dataset && ev.target.dataset.mode;
    if (mode) patchSettings({ mode });
  });

  // Ajuste fino: cada toque é 1%. O barco limita e guarda. Logo depois de um
  // toque, a página não escuta o estado por um segundo, pra não voltar o
  // número no meio de uma sequência de toques
  let trim = 0, trimTouched = 0;
  function showTrim(value) {
    trim = value;
    $("trim").textContent = (value > 0 ? "+" : "") + value + "%";
  }
  function nudgeTrim(step) {
    showTrim(trim + step); trimTouched = Date.now();
    patchSettings({ trim });
  }
  $("trim-left").addEventListener("click", () => nudgeTrim(-1));
  $("trim-right").addEventListener("click", () => nudgeTrim(1));

  // ------------------------------------------------------------ Estado
  // GET /api/status duas vezes por segundo; um pedido de cada vez
  let failsafe = true, asking = false;
  async function askStatus() {
    if (asking) return;
    asking = true;
    try {
      const response = await fetch("/api/status", { cache: "no-store" });
      const s = await response.json();
      $("bat").textContent = s.bat.toFixed(2) + " V";
      showMode(s.mode);
      if (Date.now() - trimTouched > 1000) showTrim(s.trim);
      failsafe = s.fs === 1;
      $("low").hidden = s.low !== 1;
    } catch (e) {
      // sem resposta: o selo mostra pelo WebSocket
    } finally {
      asking = false;
      showLink();
    }
  }
  setInterval(askStatus, 500);

  function showLink() {
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      state.textContent = "sem sinal"; state.className = "pill bad";
    } else if (failsafe) {
      state.textContent = "failsafe"; state.className = "pill bad";
    } else {
      state.textContent = "conectado"; state.className = "pill ok";
    }
  }

  connect();
  askStatus();
</script>
</body>
</html>
